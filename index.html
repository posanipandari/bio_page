<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posani Pandari | Links</title>

    <!-- Font Awesome icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <!-- Profile section -->
        <section class="profile-section">
            <div class="profile-image">
                <i class="fa-solid fa-user"></i>
            </div>

            <h1>Posani Pandari</h1>
            <p>@posanipandari</p>
        </section>

        <!-- Link buttons -->
        <section class="links">

            <a href="https://posanipandari.github.io/personal-portfolio/"
               class="link-button" target="_blank">
                <span class="left-icon"><i class="fa-solid fa-globe"></i></span>
                <span>PORTFOLIO</span>
                <span class="right-icon"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="https://www.geeksforgeeks.org/"
               class="link-button" target="_blank">
                <span class="left-icon"><i class="fa-solid fa-code"></i></span>
                <span>GEEKSFORGEEKS</span>
                <span class="right-icon"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="https://leetcode.com/"
               class="link-button" target="_blank">
                <span class="left-icon"><i class="fa-solid fa-laptop-code"></i></span>
                <span>LEETCODE</span>
                <span class="right-icon"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="https://github.com/"
               class="link-button" target="_blank">
                <span class="left-icon"><i class="fa-brands fa-github"></i></span>
                <span>GITHUB</span>
                <span class="right-icon"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="https://youtube.com/"
               class="link-button" target="_blank">
                <span class="left-icon"><i class="fa-brands fa-youtube"></i></span>
                <span>YOUTUBE</span>
                <span class="right-icon"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="https://linkedin.com/"
               class="link-button" target="_blank">
                <span class="left-icon"><i class="fa-brands fa-linkedin"></i></span>
                <span>LINKEDIN</span>
                <span class="right-icon"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

        </section>

    </main>

    <!-- Bottom Lnk.Bio-style bar -->
    <footer class="bottom-bar">
        <div class="lnk-brand">
            <div class="lnk-logo">
                <i class="fa-solid fa-link"></i>
            </div>
            <strong>Lnk.Bio</strong>
        </div>

        <button class="get-button">
            <i class="fa-solid fa-link"></i>
            GET
        </button>
    </footer>

</body>
</html>
